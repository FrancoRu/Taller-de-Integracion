name: club12

services:
  backend:
    build: { context: ./Club12-Backend }
    image: ghcr.io/francoru/club12-backend:latest
    env_file: .env
    environment:
      ASPNETCORE_ENVIRONMENT: Production
    expose: ["8080"]
    networks: [club12]
    volumes:
      - backup-data:/app/backups
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 1g
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/health/ready"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 90s

  frontend:
    build:
      context: ./Club12-WebClient
    image: ghcr.io/francoru/club12-frontend:latest
    depends_on:
      backend: { condition: service_healthy }
    ports: ["${FRONTEND_PORT:-5001}:80"]
    networks: [club12]
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 128m

networks:
  club12: { driver: bridge }

volumes:
  backup-data: {}
