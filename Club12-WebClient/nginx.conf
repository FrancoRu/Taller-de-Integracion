server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        proxy_pass http://backend:8080;   # no URI part → original /api/... path is forwarded verbatim
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # 60s (nginx's implicit default too) is too short for
        # POST /api/backups/{id}/restore, which does a full safety backup +
        # download + psql restore round-trip and can legitimately run past a
        # minute — the backend keeps running to completion regardless, but
        # nginx closing the upstream connection here surfaces to the client
        # as a 499, even though the restore itself succeeded server-side.
        proxy_read_timeout 300s;
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location = /index.html { add_header Cache-Control "no-cache"; }

    location / { try_files $uri $uri/ /index.html; }
}
