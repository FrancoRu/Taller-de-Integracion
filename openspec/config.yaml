schema: spec-driven

context: |
  Monorepo: Club12 (basketball tournament management, "Liga Club12").
  Backend: Club12-Backend — .NET 8, ASP.NET Core Web API, Clean Architecture
    (API / Application / Domain / Infrastructure), EF Core + Identity, JWT auth,
    AutoMapper, Serilog. Solution at Club12-Backend/Solution/Club12.sln.
  Frontend: Club12-WebClient — React 18 + TypeScript 5 + Vite 7, MUI 5,
    TanStack Query 5, React Router 6, Axios, feature-module layout
    (src/modules/{domain}, src/views/{domain}).
  Testing: xUnit + WebApplicationFactory on the backend (Club12-Backend/API.Tests),
    Vitest + Testing Library on the frontend (Club12-WebClient) — both set up in
    the codebase-clean-architecture-audit change (2026-08-15).
  Style: backend uses PascalCase C# conventions throughout, including
    `public const` fields (see Club12-Backend/DOTNET_STANDARDS.md and
    Club12-Backend/.editorconfig, both added 2026-09-05 — supersede the older
    Solution/.github/copilot-instructions.md on this point); frontend uses
    ESLint (standard config) + Prettier.

strict_tdd: true

testing:
  backend:
    test_runner: "xUnit + Microsoft.AspNetCore.Mvc.Testing (WebApplicationFactory), SQLite in-memory"
    command: "dotnet test Club12-Backend/Solution/Club12.sln"
  frontend:
    test_runner: "Vitest + @testing-library/react (jsdom)"
    command: "npm run test --prefix Club12-WebClient"

rules:
  proposal:
    - Include rollback plan for risky changes
    - State whether a change touches backend, frontend, or both
  specs:
    - Use Given/When/Then for scenarios
    - Use RFC 2119 keywords (MUST, SHALL, SHOULD, MAY)
  design:
    - Include sequence diagrams for complex flows
    - Document architecture decisions with rationale
    - For backend changes, respect Clean Architecture layering (API -> Application -> Domain, Infrastructure implements Application interfaces)
  tasks:
    - Group by phase, use hierarchical numbering
    - Keep tasks completable in one session
    - Split backend and frontend task groups when a change spans both projects
  apply:
    guidelines:
      - Follow existing code patterns (Clean Architecture on backend, feature-module layout on frontend)
    tdd: true
    test_command: "dotnet test Club12-Backend/Solution/Club12.sln && npm run test --prefix Club12-WebClient"
  verify:
    test_command: "dotnet test Club12-Backend/Solution/Club12.sln && npm run test --prefix Club12-WebClient"
    build_command_backend: "dotnet build Club12-Backend/Solution/Club12.sln"
    build_command_frontend: "cd Club12-WebClient && npm run build"
    coverage_threshold: 0
  archive:
    - Warn before merging destructive deltas
